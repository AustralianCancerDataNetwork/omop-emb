name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  label-gate:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/label-gate.yml@main
  build-test-sqlite:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test.yml@main
  build-test-postgres:
    uses: AustralianCancerDataNetwork/cava-devops/.github/workflows/build-test-postgres-v2.yml@main
    with:
      postgres-image: pgvector/pgvector:pg16
      postgres-user: test
      postgres-password: test
      postgres-db: postgres
      setup-commands: |
        uv run omop-config configure omop_emb \
          --set test_emb_db_pg.kind=generic \
          --set test_emb_db_pg.connection.dialect=postgresql+psycopg \
          --set test_emb_db_pg.connection.host=localhost \
          --set test_emb_db_pg.connection.port=5432 \
          --set test_emb_db_pg.connection.user=test \
          --set test_emb_db_pg.connection.password=test \
          --set test_emb_db_pg.connection.database_name=test_omop_emb \
          --set test_emb_db_pg.connection.test_only=true \
          --set test_emb_db_pg.schema_name=public \
          --set cdm_db.kind=cdm \
          --set cdm_db.connection.dialect=postgresql+psycopg \
          --set cdm_db.connection.host=localhost \
          --set cdm_db.connection.port=5432 \
          --set cdm_db.connection.user=test \
          --set cdm_db.connection.password=test \
          --set cdm_db.connection.database_name=test_omop_emb_cdm \
          --set cdm_db.cdm_schema=cdm \
          --set embedding_model_name.provider.provider=ollama \
          --set embedding_model_name.provider.base_url=http://127.0.0.1:11434 \
          --set embedding_model_name.model=nomic-embed-text \
          --set embedding_model_name.embeddings=true \
          --set vector_store_name.backend_type=pgvector \
          --set vector_store_name.database.kind=generic \
          --set vector_store_name.database.connection.dialect=postgresql+psycopg \
          --set vector_store_name.database.connection.host=localhost \
          --set vector_store_name.database.connection.port=5432 \
          --set vector_store_name.database.connection.user=test \
          --set vector_store_name.database.connection.password=test \
          --set vector_store_name.database.connection.database_name=test_omop_emb_vectors \
          --set vector_store_name.database.schema_name=public
